<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local RAG - Enhanced UI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <script>
      // Custom Tailwind configuration
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "brand-bg": "#fcf0e2",
              "brand-dark-purple": "#3a2d56",
              "brand-light-purple": "#6d4f98",
              "brand-pink": "#d86a8a",
              "brand-orange": "#f5b37e",
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      /* Custom scrollbar for chat messages */
      #chat-messages::-webkit-scrollbar {
        width: 6px;
      }
      #chat-messages::-webkit-scrollbar-track {
        background: transparent;
      }
      #chat-messages::-webkit-scrollbar-thumb {
        background: #d86a8a;
        border-radius: 3px;
      }
      #chat-messages::-webkit-scrollbar-thumb:hover {
        background: #c75a79;
      }

      /* Simple fade-in animation for UI elements */
      .fade-in {
        animation: fadeIn 0.5s ease-in-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Glassmorphism effect for the side panel */
      .glassmorphism {
        background: rgba(
          58,
          45,
          86,
          0.75
        ); /* Increased opacity for better readability */
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .glassmorphism-light {
        background: rgba(253, 251, 247, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(58, 45, 86, 0.1);
      }

      /* Animation for the floating brain on the welcome screen */
      #welcome-brain {
        animation: float 6s ease-in-out infinite,
          pulse-glow 4s ease-in-out infinite;
      }
      @keyframes float {
        0% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-20px);
        }
        100% {
          transform: translateY(0px);
        }
      }
      @keyframes pulse-glow {
        0% {
          filter: drop-shadow(0 0 5px rgba(216, 106, 138, 0.4));
        }
        50% {
          filter: drop-shadow(0 0 20px rgba(110, 79, 152, 0.6));
        }
        100% {
          filter: drop-shadow(0 0 5px rgba(216, 106, 138, 0.4));
        }
      }
    </style>
  </head>
  <body class="bg-brand-bg text-brand-dark-purple">
    <!-- Main layout container -->
    <div class="flex flex-col lg:flex-row h-screen">
      <!-- Left Column: File Management -->
      <div
        id="file-panel"
        class="w-full lg:w-1/5 text-gray-200 p-6 flex-col absolute lg:relative inset-y-0 left-0 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out z-30 flex glassmorphism rounded-r-2xl"
      >
        <div class="flex justify-between items-center mb-8">
          <div class="flex items-center space-x-3">
            <span
              class="bg-gradient-to-br from-brand-pink to-brand-orange p-2 rounded-lg shadow-lg"
            >
              <i class="fa-solid fa-brain fa-lg text-white"></i>
            </span>
            <h1 class="text-2xl font-bold text-white">Second Brain</h1>
          </div>
          <button
            id="close-panel-btn"
            class="lg:hidden text-gray-300 hover:text-white"
          >
            <i class="fa-solid fa-times fa-lg"></i>
          </button>
        </div>
        <div class="mb-6">
          <h2
            class="text-sm font-semibold mb-3 text-gray-200 uppercase tracking-wider"
          >
            Upload New File
          </h2>
          <div class="bg-black bg-opacity-20 p-4 rounded-lg">
            <input
              type="file"
              id="file-input"
              class="block w-full text-sm text-gray-300 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-gradient-to-r file:from-brand-pink file:to-brand-orange file:text-white hover:file:opacity-90 cursor-pointer transition-opacity"
            />
            <button
              id="upload-button"
              class="mt-4 w-full bg-gradient-to-r from-brand-pink to-brand-orange text-white py-2 px-4 rounded-lg hover:opacity-90 transition-opacity font-semibold shadow-md disabled:opacity-50 disabled:cursor-not-allowed"
            >
              <i class="fa-solid fa-upload mr-2"></i>Upload
            </button>
            <p
              id="upload-status"
              class="text-xs text-center mt-2 text-gray-300 h-4"
            ></p>
          </div>
        </div>
        <div class="flex-1 overflow-y-auto pr-2">
          <h2
            class="text-sm font-semibold mb-3 text-gray-200 uppercase tracking-wider"
          >
            Knowledge Base
          </h2>
          <ul id="file-list" class="space-y-2"></ul>
        </div>
      </div>
      <!-- Mobile overlay for side panel -->
      <div
        id="panel-overlay"
        class="lg:hidden fixed inset-0 bg-black opacity-50 z-20 hidden"
      ></div>

      <!-- Right Column: Chat Interface -->
      <div class="w-full lg:w-4/5 flex flex-col bg-brand-bg h-screen">
        <div
          class="border-b border-brand-dark-purple border-opacity-10 p-4 flex items-center justify-between"
        >
          <div class="flex items-center">
            <button
              id="open-panel-btn"
              class="lg:hidden mr-4 text-brand-dark-purple hover:text-brand-pink"
            >
              <i class="fa-solid fa-bars fa-lg"></i>
            </button>
            <h2 class="text-xl font-bold text-brand-dark-purple">
              Chat Assistant
            </h2>
          </div>
          <span
            id="status-indicator"
            class="w-3 h-3 bg-red-500 rounded-full animate-pulse"
            title="Backend Disconnected"
          ></span>
        </div>
        <div
          id="chat-messages"
          class="flex-1 p-6 overflow-y-auto space-y-6 relative"
        >
          <div
            id="welcome-screen"
            class="absolute inset-0 flex flex-col justify-center items-center transition-all duration-500 ease-in-out p-4"
          >
            <img
              id="welcome-brain"
              src="brain logo.png"
              alt="Polygonal Brain"
              class="w-48 h-48 md:w-64 md:h-64 object-contain rounded-2xl"
              onerror="this.onerror=null; this.src='https://placehold.co/256x256/FFF8F0/3a2d56?text=Brain+Image';"
            />
            <h3 class="mt-12 text-xl text-brand-dark-purple opacity-70">
              Ask me anything!
            </h3>
          </div>
        </div>
        <div class="p-6 bg-transparent">
          <div
            class="flex items-center glassmorphism-light rounded-xl p-2 shadow-sm"
          >
            <textarea
              id="chat-input"
              placeholder="Ask a question..."
              class="flex-1 p-2 bg-transparent border-0 rounded-lg focus:outline-none resize-none text-brand-dark-purple placeholder-brand-dark-purple placeholder-opacity-50"
              rows="1"
            ></textarea>
            <button
              id="send-button"
              class="bg-gradient-to-br from-brand-pink to-brand-orange text-white rounded-lg w-10 h-10 flex items-center justify-center hover:opacity-90 transition-all disabled:from-gray-400 disabled:to-gray-500 disabled:cursor-not-allowed shadow-md"
            >
              <i class="fa-solid fa-paper-plane"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Custom Deletion Confirmation Modal -->
    <div
      id="delete-modal"
      class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 hidden fade-in"
    >
      <div
        class="bg-white rounded-2xl shadow-2xl p-8 m-4 max-w-sm w-full text-center transform transition-all scale-95 opacity-0"
        id="modal-content"
      >
        <i
          class="fa-solid fa-triangle-exclamation text-5xl text-red-500 mb-4"
        ></i>
        <h3 class="text-xl font-bold text-brand-dark-purple mb-2">
          Are you sure?
        </h3>
        <p class="text-gray-600 mb-6">
          This will permanently delete
          <strong id="filename-to-delete"></strong> from your knowledge base.
        </p>
        <div class="flex justify-center space-x-4">
          <button
            id="cancel-delete-btn"
            class="py-2 px-6 bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300 transition-colors font-semibold"
          >
            Cancel
          </button>
          <button
            id="confirm-delete-btn"
            class="py-2 px-6 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors font-bold"
          >
            Delete
          </button>
        </div>
      </div>
    </div>

    <script>
      const API_URL = "http://3.215.77.207:8000";

      // --- DOM ELEMENTS ---
      const welcomeScreen = document.getElementById("welcome-screen");
      const openBtn = document.getElementById("open-panel-btn");
      const closeBtn = document.getElementById("close-panel-btn");
      const panel = document.getElementById("file-panel");
      const overlay = document.getElementById("panel-overlay");
      const fileInput = document.getElementById("file-input");
      const uploadButton = document.getElementById("upload-button");
      const uploadStatus = document.getElementById("upload-status");
      const fileList = document.getElementById("file-list");
      const chatMessages = document.getElementById("chat-messages");
      const chatInput = document.getElementById("chat-input");
      const sendButton = document.getElementById("send-button");
      const statusIndicator = document.getElementById("status-indicator");
      const deleteModal = document.getElementById("delete-modal");
      const modalContent = document.getElementById("modal-content");
      const filenameToDeleteSpan =
        document.getElementById("filename-to-delete");
      const cancelDeleteBtn = document.getElementById("cancel-delete-btn");
      const confirmDeleteBtn = document.getElementById("confirm-delete-btn");

      // --- STATE ---
      let chatHistory = []; // Stores conversation history
      let fileToDelete = null; // Stores filename for deletion confirmation

      // --- MOBILE PANEL TOGGLE ---
      function openPanel() {
        panel.classList.remove("-translate-x-full");
        overlay.classList.remove("hidden");
      }
      function closePanel() {
        panel.classList.add("-translate-x-full");
        overlay.classList.add("hidden");
      }
      openBtn.addEventListener("click", openPanel);
      closeBtn.addEventListener("click", closePanel);
      overlay.addEventListener("click", closePanel);

      // --- FILE MANAGEMENT ---
      async function fetchFiles() {
        try {
          const response = await fetch(`${API_URL}/api/files`);
          if (!response.ok) throw new Error("Failed to fetch files");
          const data = await response.json();
          renderFileList(data.files);
          statusIndicator.classList.remove("bg-red-500", "animate-pulse");
          statusIndicator.classList.add("bg-green-500");
          statusIndicator.title = "Backend Connected";
        } catch (error) {
          console.error("Error fetching files:", error);
          fileList.innerHTML =
            '<li class="text-red-400 text-sm p-3 bg-red-900 bg-opacity-20 rounded-lg">Could not load files. Is the server running?</li>';
          statusIndicator.classList.remove("bg-green-500");
          statusIndicator.classList.add("bg-red-500", "animate-pulse");
          statusIndicator.title = "Backend Disconnected";
        }
      }

      function getFileIcon(filename) {
        const extension = filename.split(".").pop().toLowerCase();
        switch (extension) {
          case "pdf":
            return "fa-file-pdf";
          case "docx":
          case "doc":
            return "fa-file-word";
          case "csv":
            return "fa-file-csv";
          case "html":
          case "htm":
            return "fa-file-code";
          case "txt":
            return "fa-file-lines";
          default:
            return "fa-file";
        }
      }

      function renderFileList(files) {
        fileList.innerHTML = "";
        if (files.length === 0) {
          fileList.innerHTML = `
            <div class="text-center text-gray-400 p-4 mt-8 fade-in">
                <i class="fa-solid fa-folder-open fa-3x mb-4 opacity-50"></i>
                <p class="text-sm font-semibold">Knowledge base is empty</p>
                <p class="text-xs opacity-70 mt-1">Upload files to begin.</p>
            </div>`;
          return;
        }
        files.forEach((file) => {
          const li = document.createElement("li");
          const iconClass = getFileIcon(file);
          li.className =
            "group bg-black bg-opacity-20 p-3 rounded-lg flex items-center justify-between text-sm transition-all duration-300 hover:bg-opacity-30 hover:shadow-lg fade-in";
          li.innerHTML = `
            <div class="flex items-center truncate min-w-0">
                <i class="fa-solid ${iconClass} text-brand-pink text-lg mr-4 flex-shrink-0"></i>
                <span class="truncate text-gray-200 group-hover:text-white transition-colors" title="${file}">${file}</span>
            </div>
            <button onclick="showDeleteConfirm('${file}')" class="text-gray-400 hover:text-red-500 transition-colors opacity-0 group-hover:opacity-100 ml-2 flex-shrink-0">
                <i class="fa-solid fa-trash-can"></i>
            </button>`;
          fileList.appendChild(li);
        });
      }

      async function uploadFile() {
        if (!fileInput.files.length) {
          uploadStatus.textContent = "Please select a file first.";
          return;
        }
        const file = fileInput.files[0];
        const formData = new FormData();
        formData.append("file", file);
        uploadStatus.textContent = `Uploading ${file.name}...`;
        uploadButton.disabled = true;
        try {
          const response = await fetch(`${API_URL}/api/upload`, {
            method: "POST",
            body: formData,
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.detail || "Upload failed");
          uploadStatus.textContent = `✅ ${result.status}`;
          fileInput.value = "";
          fetchFiles();
        } catch (error) {
          uploadStatus.textContent = `❌ Error: ${error.message}`;
        } finally {
          uploadButton.disabled = false;
          setTimeout(() => (uploadStatus.textContent = ""), 4000);
        }
      }

      window.showDeleteConfirm = (filename) => {
        fileToDelete = filename;
        filenameToDeleteSpan.textContent = fileToDelete;
        deleteModal.classList.remove("hidden");
        setTimeout(
          () => modalContent.classList.remove("scale-95", "opacity-0"),
          10
        );
      };

      function hideDeleteConfirm() {
        modalContent.classList.add("scale-95", "opacity-0");
        setTimeout(() => {
          deleteModal.classList.add("hidden");
          fileToDelete = null;
        }, 200);
      }

      async function executeDelete() {
        if (!fileToDelete) return;
        try {
          const response = await fetch(`${API_URL}/api/files/${fileToDelete}`, {
            method: "DELETE",
          });
          if (!response.ok)
            throw new Error(
              (await response.json()).detail || "Deletion failed"
            );
          fetchFiles();
          // REMOVED: The line that cleared chat history is now gone.
        } catch (error) {
          // Replaced alert with a less intrusive error message mechanism if needed in future
          console.error(`Could not delete file: ${error.message}`);
        } finally {
          hideDeleteConfirm();
        }
      }

      // --- CHAT FUNCTIONALITY ---
      function addChatMessage(role, content) {
        const wrapper = document.createElement("div");
        wrapper.className = "flex fade-in";
        let messageDiv;
        if (role === "user") {
          wrapper.classList.add("justify-end");
          messageDiv = `<div class="bg-brand-dark-purple text-white p-4 rounded-2xl rounded-br-none shadow-md max-w-lg"><p class="text-sm">${content}</p></div>`;
        } else {
          wrapper.classList.add("justify-start");
          messageDiv = `<div class="bg-white p-4 rounded-2xl rounded-bl-none shadow-md max-w-lg border border-gray-200"><p class="text-sm text-brand-dark-purple">${content}</p></div>`;
        }
        wrapper.innerHTML = messageDiv;
        chatMessages.appendChild(wrapper);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        return wrapper.querySelector("p");
      }

      async function handleSend() {
        const question = chatInput.value.trim();
        if (!question) return;

        if (chatHistory.length === 0) {
          welcomeScreen.classList.add("opacity-0", "scale-90");
          setTimeout(() => {
            welcomeScreen.style.display = "none";
          }, 500);
        }

        addChatMessage("user", question);
        chatInput.value = "";
        chatInput.style.height = "auto";
        sendButton.disabled = true;

        const thinkingMessageP = addChatMessage(
          "bot",
          '<span class="italic opacity-70">Thinking...</span>'
        );
        let fullResponse = "";

        try {
          const response = await fetch(`${API_URL}/api/ask`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ q: question, chat_history: chatHistory }),
          });

          if (!response.ok)
            throw new Error(`HTTP error! status: ${response.status}`);

          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let firstChunk = true;

          while (true) {
            const { value, done } = await reader.read();
            if (done) break;

            const chunk = decoder.decode(value, { stream: true });
            fullResponse += chunk;

            if (firstChunk) {
              thinkingMessageP.innerHTML = ""; // Clear "Thinking..."
              firstChunk = false;
            }

            thinkingMessageP.innerHTML = fullResponse.replace(/\n/g, "<br>");
            chatMessages.scrollTop = chatMessages.scrollHeight;
          }

          chatHistory.push([question, fullResponse]);
        } catch (error) {
          console.error("Error asking question:", error);
          thinkingMessageP.innerHTML =
            "Sorry, something went wrong. Please check the server logs.";
          thinkingMessageP.parentElement.classList.add("text-red-500");
        } finally {
          sendButton.disabled = false;
          chatInput.focus();
        }
      }

      // --- INITIALIZATION & EVENT LISTENERS ---
      document.addEventListener("DOMContentLoaded", () => {
        uploadButton.addEventListener("click", uploadFile);
        sendButton.addEventListener("click", handleSend);
        chatInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            handleSend();
          }
        });
        chatInput.addEventListener("input", () => {
          chatInput.style.height = "auto";
          chatInput.style.height = chatInput.scrollHeight + "px";
        });

        // Modal listeners
        cancelDeleteBtn.addEventListener("click", hideDeleteConfirm);
        confirmDeleteBtn.addEventListener("click", executeDelete);

        fetchFiles();
      });
    </script>
  </body>
</html>
